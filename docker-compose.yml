services:
  postgres:
    image: postgres:16-alpine
    container_name: parallax-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: parallax
      POSTGRES_PASSWORD: parallax_secret_password
      POSTGRES_DB: parallax_db
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parallax -d parallax_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: parallax-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
